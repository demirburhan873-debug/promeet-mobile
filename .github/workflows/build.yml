name: Build ProMeet APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install System Dependencies
      run: |
        sudo apt update
        sudo apt install -y git zip unzip openjdk-17-jdk signapk python3-pip autoconf libtool libtool-bin m4 automake pkg-config zlib1g-dev libncurses5-dev libgdbm-dev libnss3-dev libssl-dev libreadline-dev libffi-dev libsqlite3-dev tk-dev libgdbm-compat-dev libc6-dev libbz2-dev aidl

    - name: Install Buildozer and Cython
      run: |
        pip3 install --upgrade pip
        pip3 install cython==0.29.33 buildozer

    - name: Auto-Configure Buildozer Spec
      run: |
        buildozer init
        # Gereksinimleri ve Android API standartlarını tam olarak kilitliyoruz
        sed -i 's/^requirements =.*/requirements = python3,kivy,opencv-python-headless,firebase-admin,aiortc,numpy,attrs/g' buildozer.spec
        sed -i 's/^android.minapi =.*/android.minapi = 24/g' buildozer.spec
        sed -i 's/^title =.*/title = ProMeet/g' buildozer.spec
        sed -i 's/^package.name =.*/package.name = promeetapp/g' buildozer.spec
        # Lisansları resmi olarak otomatik kabul etme komutunu aktif ediyoruz
        sed -i 's/^#android.accept_licenses =.*/android.accept_licenses = Yes/g' buildozer.spec

    - name: Build Android APK
      run: |
        export BUILDOZER_WARN_ON_ROOT=0
        # Hattı tıkayan 'yes |' komutunu kaldırıp temiz bir inşa başlatıyoruz
        buildozer android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ProMeet-APK
        path: bin/*.apk
