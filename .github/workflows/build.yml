name: Build ProMeet APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install System Dependencies
      run: |
        sudo apt update
        sudo apt install -y git zip unzip openjdk-17-jdk signapk python3-pip autoconf libtool libtool-bin m4 automake pkg-config zlib1g-dev libncurses5-dev libgdbm-dev libnss3-dev libssl-dev libreadline-dev libffi-dev libsqlite3-dev tk-dev libgdbm-compat-dev libc6-dev libbz2-dev

    - name: Install Buildozer and Cython
      run: |
        pip3 install --upgrade pip
        pip3 install cython==0.29.33 buildozer

    - name: Pre-Accept Android Licenses (System Level)
      run: |
        # Android SDK henüz kurulmamış olsa bile sunucunun tüm Android lisans yollarını peşinen onaylıyoruz
        mkdir -p ~/.android
        touch ~/.android/repositories.cfg
        mkdir -p /home/runner/.buildozer/android/platform/android-sdk/licenses || true
        
        # Google'ın mevcut tüm lisans metin anahtarlarını sunucuya doğrudan kilitliyoruz
        echo -e "\n24711ab3ca0ecae6dcc963a192d9e224b2531201\n84831b9409646a547e0da9e7d355d540c121d844\n504667f4c0de7af1a06de9f4b1727b84351f2910" > /home/runner/.buildozer/android/platform/android-sdk/licenses/android-sdk-license || true
        echo -e "\n849d667467436bf16a5de464d85f69d9241562e7" > /home/runner/.buildozer/android/platform/android-sdk/licenses/android-googletv-license || true
        echo -e "\nd56f118745b66e31e01333d1a66a6fbc0e307e79" > /home/runner/.buildozer/android/platform/android-sdk/licenses/android-sdk-preview-license || true

    - name: Generate Buildozer Spec
      run: |
        buildozer init
        sed -i 's/^requirements =.*/requirements = python3,kivy,opencv-python-headless,firebase-admin,aiortc,numpy,attrs/g' buildozer.spec
        sed -i 's/^android.minapi =.*/android.minapi = 24/g' buildozer.spec
        sed -i 's/^title =.*/title = ProMeet/g' buildozer.spec
        sed -i 's/^package.name =.*/package.name = promeetapp/g' buildozer.spec

    - name: Build Android APK
      run: |
        export BUILDOZER_WARN_ON_ROOT=0
        # Lisanslar sistem seviyesinde onaylandığı için artık düz ve temiz bir şekilde derlemeyi başlatıyoruz
        buildozer android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ProMeet-APK
        path: bin/*.apk
