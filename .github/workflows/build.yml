name: Build ProMeet APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install System Dependencies
      run: |
        sudo apt update
        sudo apt install -y git zip unzip openjdk-17-jdk signapk python3-pip autoconf libtool libtool-bin m4 automake pkg-config zlib1g-dev libncurses5-dev libgdbm-dev libnss3-dev libssl-dev libreadline-dev libffi-dev libsqlite3-dev tk-dev libgdbm-compat-dev libc6-dev libbz2-dev

    - name: Install Buildozer and Cython
      run: |
        pip3 install --upgrade pip
        pip3 install cython==0.29.33 buildozer

    - name: Fix Buildozer SDK Path (The Real Fix)
      run: |
        # Buildozer'ın arayıp da bulamadığı o eski tip klasör yapısını sunucuda önceden hazırlıyoruz
        mkdir -p /home/runner/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin
        mkdir -p /home/runner/.buildozer/android/platform/android-sdk/tools/bin
        
        # Resmi Google komut satırı araçlarını indirip Buildozer'ın klasörüne açıyoruz
        wget -q https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O cmdline.zip
        unzip -q cmdline.zip
        mv cmdline-tools/* /home/runner/.buildozer/android/platform/android-sdk/cmdline-tools/latest/ || true
        
        # Buildozer eski yolu aradığında güncel olana gitmesi için sihirli bir köprü (Link) kuruyoruz
        ln -s /home/runner/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin/sdkmanager /home/runner/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager || true
        
        # Lisansları peşinen sunucuya onaylatıyoruz
        yes | /home/runner/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true

    - name: Generate Buildozer Spec
      run: |
        buildozer init
        sed -i 's/^requirements =.*/requirements = python3,kivy,opencv-python-headless,firebase-admin,aiortc,numpy,attrs/g' buildozer.spec
        sed -i 's/^android.minapi =.*/android.minapi = 24/g' buildozer.spec
        sed -i 's/^title =.*/title = ProMeet/g' buildozer.spec
        sed -i 's/^package.name =.*/package.name = promeetapp/g' buildozer.spec

    - name: Build Android APK
      run: |
        export BUILDOZER_WARN_ON_ROOT=0
        # Artık her şey yerli yerinde olduğu için temizce derliyoruz
        buildozer android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ProMeet-APK
        path: bin/*.apk
